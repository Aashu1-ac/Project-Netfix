<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!--header-->  
  <header class="site-header" aria-label="Main navigation">
    <div class="container header-inner">
      <div class="logo" aria-label="Site logo">
        <span class="logo-text">N</span><span class="logo-text light">etflix</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">TV Shows</a>
        <a href="#" class="nav-link">Movies</a>
        <a href="#" class="nav-link">New &amp; Popular</a>
        <a href="#" class="nav-link">My List</a>
      </nav>

      <div class="user-actions">
        <button class="btn small" aria-label="Search">Search</button>
        <button class="btn small" aria-label="Account">Account</button>
      </div>
    </div>
  </header>

  <!-- Hero section -->
  <section class="hero" aria-label="Hero banner">
    <div class="container hero-content">
      <h1 class="hero-title">Unlimited movies, TV shows and more.</h1>
      <p class="hero-sub">Watch anywhere. Cancel anytime.</p>
      <div class="hero-actions">
        <button class="btn primary" aria-label="Get started">Get Started</button>
        <button class="btn" aria-label="Learn more">Learn more</button>
      </div>
    </div>
  </section>

  <!-- Main content rows -->
  <main class="content" aria-label="Content rows">
    <!-- Row 1 -->
    <section class="row" aria-label="Trending Now">
      <div class="container">
        <h2 class="row-title">Trending Now</h2>
        <div class="card-strip">
          <article class="card">
            <img src="https://via.placeholder.com/240x340?text=Poster+1" alt="Trending movie 1" />
            <div class="card-info">
              <h3 class="card-title">Movie 1</h3>
              <p class="card-sub">2024 • U/A 13+</p>
            </div>
          </article>

          <article class="card">
            <img src="https://via.placeholder.com/240x340?text=Poster+2" alt="Trending movie 2" />
            <div class="card-info">
              <h3 class="card-title">Movie 2</h3>
              <p class="card-sub">2023 • U/A 16+</p>
            </div>
          </article>
